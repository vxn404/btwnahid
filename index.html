  <script defer>
(() => {
  const loader = document.getElementById("loader");
  const fill = document.getElementById("progressFill");
  const status = document.getElementById("loaderStatus");
  const embers = document.getElementById("embers");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // A small, fixed ember field keeps the effect light on mobile devices.
  if (embers && !reduceMotion) {
    const count = window.innerWidth < 600 ? 17 : 29;
    for (let i = 0; i < count; i += 1) {
      const ember = document.createElement("span");
      ember.className = "ember";
      ember.style.left = `${Math.random() * 100}%`;
      ember.style.setProperty("--duration", `${7 + Math.random() * 8}s`);
      ember.style.setProperty("--delay", `${-Math.random() * 14}s`);
      ember.style.setProperty("--drift", `${Math.round((Math.random() - 0.5) * 150)}px`);
      ember.style.width = ember.style.height = `${1 + Math.random() * 2}px`;
      embers.appendChild(ember);
    }
  }

  if (!loader || !fill) return;
  if (reduceMotion) {
    fill.style.width = "100%";
    status.textContent = "EXPERIENCE READY";
    window.addEventListener("load", () => window.setTimeout(() => loader.classList.add("is-hidden"), 100));
    return;
  }

  let progress = 0;
  const tick = window.setInterval(() => {
    progress = Math.min(100, progress + (progress < 70 ? 5 : 2));
    fill.style.width = `${progress}%`;
    if (progress >= 100) {
      window.clearInterval(tick);
      status.textContent = "EXPERIENCE READY";
      window.setTimeout(() => loader.classList.add("is-hidden"), 220);
    }
  }, 45);
  window.addEventListener("load", () => {
    // If assets finish early, complete the progress smoothly rather than waiting on a long timer.
    progress = Math.max(progress, 86);
  }, { once: true });
})();
  </script>

      <feDisplacementMap in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
