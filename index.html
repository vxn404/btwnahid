  <script>
(() => {
  "use strict";

  // Minimal monochrome intro: no logo, no color, no artificial long wait.
  const loader = document.getElementById("loader");
  const fill = document.getElementById("progressFill");
  const status = document.getElementById("loaderStatus");
  const canvas = document.getElementById("fireCanvas");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Slower, eased intro: at least ~2.8s, and never hides before the page is ready.
  let pageReady = document.readyState === "complete";
  window.addEventListener("load", () => { pageReady = true; }, { once: true });

  const introStart = performance.now();
  const minimumIntro = reduceMotion ? 250 : 2850;
  let introFrame = 0;
  function animateIntro(now) {
    const elapsed = now - introStart;
    const timeProgress = Math.min(1, elapsed / minimumIntro);
    // Ease-out curve keeps the progress bar smooth instead of stepping.
    const eased = 1 - Math.pow(1 - timeProgress, 2.2);
    const progress = Math.min(pageReady ? 100 : 94, eased * 100);
    if (fill) fill.style.width = progress.toFixed(2) + "%";

    if (timeProgress >= 1 && pageReady) {
      if (fill) fill.style.width = "100%";
      if (status) status.textContent = "EXPERIENCE READY";
      window.setTimeout(() => loader?.classList.add("is-hidden"), reduceMotion ? 0 : 420);
      return;
    }
    introFrame = requestAnimationFrame(animateIntro);
  }
  introFrame = requestAnimationFrame(animateIntro);

  // Procedural, fluid flame field. Rendered as a low-resolution heat map
  // and smoothly upscaled, creating organic edges rather than polygon shapes.
  if (!canvas || reduceMotion) return;
  const ctx = canvas.getContext("2d", { alpha: true });
  if (!ctx) return;

  let width = 0, height = 0, dpr = 1, raf = 0, lastFrame = 0;
  let fireWidth = 150, fireHeight = 230, fireCanvas, fireCtx, firePixels;
  let imageData;
  const embers = [];
  const rand = (min, max) => min + Math.random() * (max - min);
  const smooth = (a, b, x) => {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    width = Math.max(1, rect.width);
    height = Math.max(1, rect.height);
    const mobile = width < 700;
    dpr = Math.min(window.devicePixelRatio || 1, mobile ? 1.35 : 1.7);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Small simulation buffer keeps the effect smooth on mid-range phones.
    fireWidth = mobile ? 132 : 210;
    fireHeight = Math.max(190, Math.round(fireWidth * height / width));
    fireCanvas = document.createElement("canvas");
    fireCanvas.width = fireWidth;
    fireCanvas.height = fireHeight;
    fireCtx = fireCanvas.getContext("2d", { alpha: true });
    imageData = fireCtx.createImageData(fireWidth, fireHeight);
    firePixels = imageData.data;

    embers.length = 0;
    const count = mobile ? 38 : 64;
    for (let i = 0; i < count; i++) {
      embers.push({
        x: rand(0, width), y: rand(0, height),
        r: rand(.45, 1.45), vy: rand(.25, .9),
        vx: rand(-.22, .22), alpha: rand(.18, .7),
        phase: rand(0, Math.PI * 2)
      });
    }
  }

  function flameHeight(nx, time, layer) {
    const t = time * (layer === 0 ? .00115 : .00082);
    const broad = Math.sin(nx * 9.2 + t * 1.7 + layer * 2.1) * .075;
    const medium = Math.sin(nx * 23.5 - t * 2.4 + layer * 4.3) * .047;
    const fine = Math.sin(nx * 51 + t * 3.7 + layer * 1.3) * .022;
    const rolling = Math.sin(nx * 5.1 - t * 1.1 + layer) * .035;
    const tongues = Math.pow(Math.max(0, Math.sin(nx * 17 + t * 2.2 + layer * 2)), 5) * .15;
    return .20 + broad + medium + fine + rolling + tongues;
  }

  function renderFlames(time) {
    const w = fireWidth, h = fireHeight;
    for (let y = 0; y < h; y++) {
      const vertical = (h - 1 - y) / h; // zero at the bottom, one at the top
      for (let x = 0; x < w; x++) {
        const nx = x / w;
        const n1 = Math.sin(x * .105 + y * .031 + time * .0021);
        const n2 = Math.sin(x * .247 - y * .052 - time * .00145 + n1 * 1.8);
        const n3 = Math.sin(x * .49 + y * .115 + time * .003 + n2);
        const turbulence = n1 * .034 + n2 * .025 + n3 * .012;

        let heat = 0;
        for (let layer = 0; layer < 3; layer++) {
          const front = flameHeight(nx, time + layer * 430, layer) + turbulence;
          const edge = front - vertical;
          const body = smooth(-.025, .085, edge);
          const taper = Math.exp(-vertical * (layer === 0 ? 2.7 : 3.7));
          const innerFlow = .66 + .22 * Math.sin(x * .16 + y * .075 - time * .003 + layer * 2);
          const layerStrength = layer === 0 ? .82 : (layer === 1 ? .47 : .24);
          heat += body * taper * innerFlow * layerStrength;
        }

        // Bright hot channels near the fuel line, with turbulent purple tips.
        const baseGlow = Math.exp(-vertical * 15) * (.22 + .18 * Math.sin(nx * 31 + time * .002));
        heat = Math.min(1, heat + baseGlow);
        const flicker = .86 + .14 * Math.sin(time * .008 + x * .13 + y * .04);
        heat = Math.max(0, Math.min(1, heat * flicker));

        const idx = (y * w + x) * 4;
        if (heat < .025) {
          firePixels[idx] = 0; firePixels[idx+1] = 0;
          firePixels[idx+2] = 0; firePixels[idx+3] = 0;
          continue;
        }

        // Purple/violet palette with a pale-magenta hot core.
        const core = Math.pow(heat, 2.4);
        firePixels[idx]   = Math.round(65 + 174 * core);
        firePixels[idx+1] = Math.round(13 + 83 * core);
        firePixels[idx+2] = Math.round(112 + 137 * core);
        firePixels[idx+3] = Math.round(255 * Math.min(.78, heat * .64));
      }
    }
    fireCtx.putImageData(imageData, 0, 0);
  }

  function draw(now) {
    raf = requestAnimationFrame(draw);
    const mobile = width < 700;
    const interval = mobile ? 1000 / 24 : 1000 / 30;
    if (now - lastFrame < interval) return;
    lastFrame = now;

    ctx.clearRect(0, 0, width, height);

    // Broad, soft light from the fire source.
    const glow = ctx.createRadialGradient(width*.5, height*1.04, 0, width*.5, height*.92, height*.78);
    glow.addColorStop(0, "rgba(151, 42, 226, .34)");
    glow.addColorStop(.35, "rgba(105, 29, 177, .19)");
    glow.addColorStop(1, "rgba(35, 7, 59, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, width, height);

    renderFlames(now);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.filter = "blur(13px)";
    ctx.globalAlpha = .48;
    ctx.drawImage(fireCanvas, -width*.035, height*.04, width*1.07, height*1.02);
    ctx.filter = "blur(3px)";
    ctx.globalAlpha = .8;
    ctx.drawImage(fireCanvas, 0, 0, width, height);
    ctx.restore();

    // Fine embers drift upward through the entire viewport.
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    embers.forEach(e => {
      e.y -= e.vy;
      e.x += e.vx + Math.sin(now*.001 + e.phase)*.16;
      if (e.y < -4) { e.y = height + rand(3, 24); e.x = rand(0, width); }
      const pulse = .45 + .55 * Math.sin(now*.002 + e.phase);
      ctx.globalAlpha = e.alpha * pulse;
      ctx.fillStyle = "#dbaaff";
      ctx.shadowColor = "#a84cff";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  resize();
  window.addEventListener("resize", () => { resize(); }, { passive: true });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else { lastFrame = 0; raf = requestAnimationFrame(draw); }
  });
  raf = requestAnimationFrame(draw);
})();
</script>
