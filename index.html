  <script>
(() => {
  "use strict";

  // Minimal monochrome intro: no logo, no color, no artificial long wait.
  const loader = document.getElementById("loader");
  const fill = document.getElementById("progressFill");
  const status = document.getElementById("loaderStatus");
  const canvas = document.getElementById("fireCanvas");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let progress = 0;
  let pageReady = document.readyState === "complete";
  window.addEventListener("load", () => { pageReady = true; }, { once: true });

  const progressTimer = window.setInterval(() => {
    const target = pageReady ? 100 : 88;
    progress = Math.min(target, progress + (progress < 65 ? 5 : 2));
    if (fill) fill.style.width = progress + "%";
    if (progress >= 100) {
      window.clearInterval(progressTimer);
      if (status) status.textContent = "EXPERIENCE READY";
      window.setTimeout(() => loader?.classList.add("is-hidden"), 180);
    }
  }, reduceMotion ? 12 : 38);

  // Canvas fire: many soft-edged, independently moving flame tongues.
  // It is drawn locally (no external assets), adapts to device pixel ratio,
  // and caps its frame rate on smaller screens.
  if (!canvas || reduceMotion) return;
  const ctx = canvas.getContext("2d", { alpha: true });
  if (!ctx) return;

  let width = 0, height = 0, dpr = 1, raf = 0, lastFrame = 0;
  const mobile = window.innerWidth < 700;
  const frameInterval = mobile ? 1000 / 30 : 1000 / 45;
  const tongues = [];
  const embers = [];
  const rand = (min, max) => min + Math.random() * (max - min);

  function resize() {
    const rect = canvas.getBoundingClientRect();
    width = Math.max(1, rect.width);
    height = Math.max(1, rect.height);
    dpr = Math.min(window.devicePixelRatio || 1, mobile ? 1.35 : 1.7);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function newTongue(initial = false) {
    const baseX = rand(-width * .04, width * 1.04);
    return {
      x: baseX,
      y: initial ? rand(height * .15, height * 1.04) : height + rand(8, 65),
      baseY: height + rand(-12, 28),
      w: rand(mobile ? 13 : 18, mobile ? 39 : 57),
      h: rand(height * .16, height * .55),
      speed: rand(.55, 1.55),
      sway: rand(8, 34),
      phase: rand(0, Math.PI * 2),
      hue: rand(258, 285),
      alpha: rand(.18, .48),
      taper: rand(.55, .9)
    };
  }

  function init() {
    tongues.length = 0;
    embers.length = 0;
    const count = mobile ? 34 : 58;
    for (let i = 0; i < count; i++) tongues.push(newTongue(true));
    const emberCount = mobile ? 22 : 38;
    for (let i = 0; i < emberCount; i++) {
      embers.push({
        x: rand(0, width), y: rand(0, height),
        r: rand(.7, 1.8), vy: rand(.35, 1.15),
        vx: rand(-.35, .35), a: rand(.2, .8),
        phase: rand(0, Math.PI * 2)
      });
    }
  }

  function drawTongue(t, time) {
    const life = Math.max(0, Math.min(1, (t.baseY - t.y) / t.h));
    const sway = Math.sin(time * .0014 + t.phase) * t.sway;
    const x = t.x + sway;
    const tipY = t.y;
    const baseY = t.baseY;
    const h = baseY - tipY;
    if (h <= 0) return;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = t.alpha * Math.min(1, life * 5 + .15);
    const grad = ctx.createLinearGradient(0, baseY, 0, tipY);
    grad.addColorStop(0, `hsla(${t.hue}, 100%, 48%, .02)`);
    grad.addColorStop(.18, `hsla(${t.hue}, 100%, 58%, .42)`);
    grad.addColorStop(.56, `hsla(${t.hue + 8}, 100%, 66%, .26)`);
    grad.addColorStop(1, `hsla(${t.hue + 14}, 100%, 76%, 0)`);
    ctx.fillStyle = grad;
    ctx.shadowColor = `hsla(${t.hue}, 100%, 60%, .45)`;
    ctx.shadowBlur = t.w * 1.25;
    ctx.beginPath();
    ctx.moveTo(x - t.w, baseY);
    ctx.bezierCurveTo(x - t.w * 1.05, baseY - h * .24, x - t.w * .28, tipY + h * .34, x + Math.sin(time*.002+t.phase)*t.w*.16, tipY);
    ctx.bezierCurveTo(x + t.w * .65, tipY + h * .28, x + t.w * 1.05, baseY - h * .2, x + t.w, baseY);
    ctx.closePath();
    ctx.fill();

    // A brighter inner tongue gives the fire depth without obscuring the page.
    const inner = ctx.createLinearGradient(0, baseY, 0, tipY + h * .15);
    inner.addColorStop(0, "rgba(193,117,255,0)");
    inner.addColorStop(.45, "rgba(205,151,255,.14)");
    inner.addColorStop(1, "rgba(235,207,255,0)");
    ctx.fillStyle = inner;
    ctx.shadowBlur = t.w * .45;
    ctx.beginPath();
    ctx.moveTo(x - t.w*.36, baseY);
    ctx.quadraticCurveTo(x - t.w*.1, tipY + h*.24, x + Math.sin(time*.002+t.phase)*t.w*.08, tipY + h*.05);
    ctx.quadraticCurveTo(x + t.w*.38, tipY + h*.3, x + t.w*.36, baseY);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function draw(now) {
    raf = requestAnimationFrame(draw);
    if (now - lastFrame < frameInterval) return;
    lastFrame = now;
    ctx.clearRect(0, 0, width, height);

    // Low purple furnace glow anchors the flames to the bottom edge.
    const glow = ctx.createRadialGradient(width*.5, height*1.02, 0, width*.5, height*1.02, height*.88);
    glow.addColorStop(0, "rgba(126, 35, 205, .28)");
    glow.addColorStop(.38, "rgba(84, 26, 151, .17)");
    glow.addColorStop(1, "rgba(35, 8, 64, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, width, height);

    tongues.forEach((t, i) => {
      t.y -= t.speed * (mobile ? 1.05 : 1.25);
      drawTongue(t, now + i * 23);
      if (t.y + t.h < 0 || t.y < t.baseY - t.h) tongues[i] = newTongue(false);
    });

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    embers.forEach(e => {
      e.y -= e.vy;
      e.x += e.vx + Math.sin(now*.001 + e.phase)*.24;
      if (e.y < -5) { e.y = height + rand(2, 35); e.x = rand(0, width); }
      const pulse = .45 + .55 * Math.sin(now*.002 + e.phase);
      ctx.globalAlpha = e.a * pulse;
      ctx.fillStyle = "#d9aaff";
      ctx.shadowColor = "#a64dff";
      ctx.shadowBlur = 9;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.restore();
  }

  resize();
  init();
  window.addEventListener("resize", () => { resize(); init(); }, { passive: true });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) cancelAnimationFrame(raf);
    else { lastFrame = 0; raf = requestAnimationFrame(draw); }
  });
  raf = requestAnimationFrame(draw);
})();
</script>
